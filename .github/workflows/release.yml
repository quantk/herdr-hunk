name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 18

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and project versions
        run: npm run version:check -- "${GITHUB_REF_NAME#v}"

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check

      - name: Smoke-test packed production install
        shell: bash
        run: |
          npm pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/pack.json"
          archive="$(node -e 'const fs=require("fs"); const path=require("path"); const pack=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/pack.json")); process.stdout.write(path.join(process.env.RUNNER_TEMP, pack[0].filename))')"
          mkdir "$RUNNER_TEMP/plugin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/plugin" --strip-components=1
          cd "$RUNNER_TEMP/plugin"
          npm install --omit=dev
          bun run scripts/smoke-installed.mjs
          python3 scripts/pty-smoke.py

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --generate-notes
