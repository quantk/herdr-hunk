name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 18
          - 20
          - 22

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: npm ci

      - name: Check version consistency
        run: npm run version:check

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check

  install-smoke:
    name: Install smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-15
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 18

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build install artifact
        run: npm pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/pack.json"

      - name: Smoke-test fresh production install
        shell: bash
        run: |
          archive="$(node -e 'const fs=require("fs"); const path=require("path"); const pack=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/pack.json")); process.stdout.write(path.join(process.env.RUNNER_TEMP, pack[0].filename))')"
          mkdir "$RUNNER_TEMP/plugin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/plugin" --strip-components=1
          cd "$RUNNER_TEMP/plugin"
          npm install --omit=dev
          bun run scripts/smoke-installed.mjs
          python3 scripts/pty-smoke.py
