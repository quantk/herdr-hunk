id = "quantick.hunk-review"
name = "Native Review"
version = "0.2.5"
min_herdr_version = "0.7.0"
description = "Review agent-authored working-tree changes and draft human feedback for the agent."
platforms = ["linux", "macos"]

[[build]]
command = ["npm", "ci", "--omit=dev"]

[[actions]]
id = "open-review"
title = "Review changes"
description = "Open a live native review in a dedicated tab and toggle back to the focused agent."
contexts = ["pane"]
command = ["node", "src/open-review.mjs"]

[[actions]]
id = "send-notes"
title = "Draft review notes for agent"
description = "Insert human review notes into the matching agent input without submitting."
contexts = ["pane"]
command = ["node", "src/send-notes.mjs"]

[[panes]]
id = "review"
title = "Review"
placement = "split"
command = ["bun", "src/review-pane.mjs"]
